<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Panorama térmico: do deserto quente ao pico nevado, com a fazenda no centro">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3c"/><stop offset="28%" stop-color="#e07a4a"/>
      <stop offset="52%" stop-color="#4a5f7e"/><stop offset="78%" stop-color="#22405f"/><stop offset="100%" stop-color="#132b45"/>
    </linearGradient>
    <linearGradient id="hveil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="60%" stop-color="#0a0704" stop-opacity=".15"/><stop offset="100%" stop-color="#080604" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="hsun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6a6"/><stop offset="45%" stop-color="#ffb347"/><stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b0632c"/><stop offset="55%" stop-color="#4c5a6e"/><stop offset="100%" stop-color="#3a5170"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f4e22"/><stop offset="50%" stop-color="#2f5a34"/><stop offset="100%" stop-color="#22364f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="760" fill="url(#hsky)"/>

  <!-- sun (hot side) -->
  <circle cx="270" cy="250" r="230" fill="url(#hsun)"/>
  <circle cx="270" cy="250" r="86" fill="#ffdf8f"/>
  <!-- moon + stars (cold side) -->
  <circle cx="1330" cy="180" r="46" fill="#dfe9f6"/><circle cx="1312" cy="168" r="46" fill="#182f49" opacity=".55"/>
  <g fill="#eaf2ff" opacity=".85"><circle cx="1120" cy="120" r="2.4"/><circle cx="1220" cy="90" r="2"/><circle cx="1420" cy="130" r="2.4"/><circle cx="1500" cy="90" r="2"/><circle cx="1250" cy="200" r="1.8"/><circle cx="1440" cy="230" r="2"/></g>

  <!-- isotherm dotted arc -->
  <path d="M0 360 Q800 250 1600 380" fill="none" stroke="#ffd9a8" stroke-width="2.5" stroke-dasharray="2 12" opacity=".5"/>

  <!-- heat shimmer (left) -->
  <g stroke="#ffe9c4" stroke-width="3" fill="none" opacity=".28">
    <path d="M120 470 q14 -10 28 0 t28 0 t28 0"/><path d="M360 500 q14 -10 28 0 t28 0"/></g>
  <!-- snow flurries (right) -->
  <g fill="#eef6ff" opacity=".7"><circle cx="1180" cy="330" r="2.5"/><circle cx="1280" cy="400" r="2"/><circle cx="1380" cy="350" r="2.5"/><circle cx="1480" cy="420" r="2"/></g>

  <!-- FAR ridge: dunes(left) -> peaks(right) -->
  <path d="M0 470
           q160 -30 300 6 q120 30 220 -6
           L760 470 q120 -70 220 -150 L1120 150 L1260 320 L1400 180 L1540 340 L1600 300 V760 H0 Z"
        fill="url(#far)" opacity=".9"/>
  <!-- snow caps sitting on the real peak apexes (1120,150) and (1400,180) -->
  <g fill="#eef6ff" opacity=".95">
    <path d="M1120 150 L1090 196 L1100 190 L1110 200 L1120 191 L1130 200 L1140 190 L1150 196 Z"/>
    <path d="M1400 180 L1374 220 L1383 214 L1392 223 L1400 215 L1408 223 L1417 214 L1426 220 Z"/>
  </g>

  <!-- MID ground: farm valley in center -->
  <path d="M0 560 q120 -20 240 4
           L520 540 q140 -18 300 6 q160 16 300 -10
           L1360 520 q120 -10 240 18 V760 H0 Z"
        fill="url(#mid)"/>

  <!-- center farm silhouettes -->
  <g fill="#16241c" opacity=".92" transform="translate(690,470)">
    <!-- barn -->
    <rect x="0" y="30" width="90" height="66" /><path d="M-8 30 L45 -2 L98 30 Z"/>
    <!-- silo -->
    <rect x="96" y="8" width="26" height="88" rx="8"/>
    <!-- tree -->
    <g transform="translate(190,20)"><rect x="-6" y="30" width="12" height="46"/><circle cx="0" cy="14" r="30"/></g>
    <!-- fence -->
    <g stroke="#16241c" stroke-width="6"><line x1="-60" y1="96" x2="-60" y2="70"/><line x1="-30" y1="96" x2="-30" y2="70"/><line x1="-72" y1="82" x2="-18" y2="82"/></g>
  </g>
  <!-- pine silhouettes (cold side) -->
  <g fill="#0f1c2a" opacity=".95">
    <g transform="translate(1200,470)"><rect x="-5" y="60" width="10" height="26"/><path d="M0 0 L34 60 H-34 Z"/><path d="M0 26 L26 76 H-26 Z"/></g>
    <g transform="translate(1330,500) scale(.82)"><rect x="-5" y="60" width="10" height="26"/><path d="M0 0 L34 60 H-34 Z"/></g>
  </g>
  <!-- cactus silhouettes (hot side) -->
  <g fill="#2a1c10" opacity=".9" transform="translate(180,470)">
    <rect x="-9" y="0" width="18" height="96" rx="9"/><path d="M-9 40 h-16 a10 10 0 0 0 -10 10 v20 a8 8 0 0 0 16 0 v-16 h10Z"/><path d="M9 26 h16 a10 10 0 0 1 10 10 v30 a8 8 0 0 1 -16 0 v-24 h-10Z"/>
  </g>

  <!-- FORE hills -->
  <path d="M0 660 q200 -30 420 6 q260 40 560 -6 q300 -40 620 14 V760 H0 Z" fill="#0b1a12"/>

  <rect width="1600" height="760" fill="url(#hveil)"/>
</svg>
